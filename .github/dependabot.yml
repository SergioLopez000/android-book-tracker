# Version updates target dev (root and /backend are separate Gradle builds). Security updates are enabled in the repo settings
# and target main; retarget them to dev (see README). Dependabot uses the first
# matching group, so test-tooling comes before the broader androidx pattern.
version: 2
updates:
  - package-ecosystem: gradle
    directory: /
    target-branch: dev
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: build
      include: scope
    groups:
      test-tooling:
        patterns: ["junit:*", "org.robolectric*", "app.cash.turbine*", "androidx.test*"]
      kotlin-ksp:
        patterns: ["org.jetbrains.kotlin:*", "org.jetbrains.kotlin.*", "com.google.devtools.ksp*"]
      kotlinx:
        patterns: ["org.jetbrains.kotlinx*"]
      androidx-compose:
        patterns: ["androidx.*"]
  - package-ecosystem: gradle
    directory: /backend
    target-branch: dev
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: build
      include: scope
    # Kotlin follows the version managed by Spring Boot, so only patch bumps are proposed.
    ignore:
      - dependency-name: "org.jetbrains.kotlin*"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
    groups:
      spring:
        patterns: ["org.springframework*"]
      testcontainers:
        patterns: ["org.testcontainers*"]
      pitest:
        patterns: ["org.pitest*", "info.solidsoft*"]
      contract:
        patterns: ["io.rest-assured*", "com.atlassian.oai*"]
  # Digest bumps for the pinned distroless base image (spike SP6 proved they are proposed).
  - package-ecosystem: docker
    directory: /backend
    target-branch: dev
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    commit-message:
      prefix: build
      include: scope
    groups:
      base-image:
        patterns: ["*"]
  # The e2e suite pins exact versions; majors of the Appium and WebdriverIO stack are bumped by hand.
  - package-ecosystem: npm
    directory: /e2e
    target-branch: dev
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: build
      include: scope
    ignore:
      - dependency-name: "appium"
        update-types: ["version-update:semver-major"]
      - dependency-name: "appium-uiautomator2-driver"
        update-types: ["version-update:semver-major"]
      - dependency-name: "webdriverio"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@wdio/*"
        update-types: ["version-update:semver-major"]
    groups:
      wdio:
        patterns: ["webdriverio", "@wdio/*", "expect-webdriverio"]
      appium:
        patterns: ["appium", "appium-*"]
      typescript:
        patterns: ["typescript", "@types/*"]
  - package-ecosystem: github-actions
    directory: /
    target-branch: dev
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: ci
      include: scope
    groups:
      actions:
        patterns: ["*"]
