# Weekly check of the PROJECT_TOKEN expiry. Opens or edits one issue (never closes or
# comments) when fewer than 14 days remain or the expiry cannot be determined.
# PROJECT_TOKEN only lives in read-expiry; the issues:write token only lives in notify.
# The logic lives in scripts/token-expiry-read.sh and scripts/token-expiry-notify.sh.
# The first run should be a manual dispatch to confirm the expiry header format.
name: Token expiry

on:
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: token-expiry
  cancel-in-progress: false

jobs:
  read-expiry:
    name: read-expiry
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      state: ${{ steps.expiry.outputs.state }}
      days: ${{ steps.expiry.outputs.days }}
      expires: ${{ steps.expiry.outputs.expires }}
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: scripts
          persist-credentials: false
      - name: Read the token expiry header
        id: expiry
        env:
          PROJECT_TOKEN: ${{ secrets.PROJECT_TOKEN }}
        run: bash scripts/token-expiry-read.sh

  notify:
    name: notify
    needs: read-expiry
    if: contains(fromJSON('["expiring","expired","invalid","missing-header","unparseable"]'), needs.read-expiry.outputs.state)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read # sparse checkout of scripts only
      issues: write
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: scripts
          persist-credentials: false
      - name: Open or update the reminder issue
        env:
          GH_TOKEN: ${{ github.token }}
          STATE: ${{ needs.read-expiry.outputs.state }}
          DAYS: ${{ needs.read-expiry.outputs.days }}
          EXPIRES: ${{ needs.read-expiry.outputs.expires }}
        run: bash scripts/token-expiry-notify.sh
