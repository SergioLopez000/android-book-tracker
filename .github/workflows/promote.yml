# Promotes the commit verified in the dev ring to staging by fast-forwarding
# `main` to it. The `staging` environment requires QA approval, so the job
# waits until a reviewer approves the deployment. Fast-forward keeps the
# exact SHA tested in dev, so artifacts are promoted instead of rebuilt.
name: Promote dev to staging

on:
  workflow_dispatch:
    inputs:
      sha:
        description: "Commit on dev to promote (defaults to the current dev head)"
        required: false
        type: string

permissions:
  contents: write
  checks: read

concurrency:
  group: promote-staging
  cancel-in-progress: false

jobs:
  promote:
    name: Fast-forward main
    if: github.ref == 'refs/heads/dev'
    runs-on: ubuntu-24.04
    environment: staging
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Resolve commit
        id: target
        env:
          INPUT_SHA: ${{ inputs.sha }}
        run: |
          sha="${INPUT_SHA:-$(git rev-parse origin/dev)}"
          sha="$(git rev-parse --verify "${sha}^{commit}")"
          git merge-base --is-ancestor "$sha" origin/dev \
            || { echo "::error::$sha is not on dev"; exit 1; }
          git merge-base --is-ancestor origin/main "$sha" \
            || { echo "::error::main is not an ancestor of $sha; fast-forward impossible"; exit 1; }
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      # The check name alone can be spoofed by another app, so the run must
      # also come from GitHub Actions (app id 15368; confirm on the first
      # real ci-gate check-run, see tasks 0.2).
      - name: Require a green ci-gate on the commit
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ steps.target.outputs.sha }}
          ACTIONS_APP_ID: "15368"
        run: |
          runs="$(gh api --paginate \
            "repos/${GITHUB_REPOSITORY}/commits/${SHA}/check-runs?check_name=ci-gate&filter=latest" \
            | jq -s --argjson app "$ACTIONS_APP_ID" \
              '[.[].check_runs[] | select(.app.id == $app)]')"
          if [ "$(jq 'length' <<<"$runs")" -eq 0 ]; then
            echo "::error::No ci-gate check-run found on $SHA"; exit 1
          fi
          state="$(jq -r 'sort_by(.started_at) | last | "\(.status)/\(.conclusion)"' <<<"$runs")"
          if [ "$state" != "completed/success" ]; then
            echo "::error::Latest ci-gate on $SHA is $state, expected completed/success"; exit 1
          fi

      - name: Fast-forward main
        env:
          SHA: ${{ steps.target.outputs.sha }}
        run: |
          git push origin "${SHA}:refs/heads/main"
          echo "### Promoted \`${SHA}\` to main (staging)" >> "$GITHUB_STEP_SUMMARY"
