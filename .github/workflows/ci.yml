# Runs the app unit tests, the backend tests and REST Assured contract tests with
# the PIT mutation gate (JDK 21, Testcontainers), the non-gating Appium e2e suite
# on an emulator and the secret scan on every pull request and dev push, then publishes Allure and
# Kover reports to gh-pages. Quality checks (lint, format, detekt, shell,
# workflows, commit messages) run ONLY locally via lefthook, never here; secrets
# are scanned here so --no-verify cannot skip them.
# `ci-gate` is the single required status check; `report` and `e2e-tests` never gate.
name: CI

on:
  pull_request:
  push:
    branches: [dev]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  GRADLE_OPTS: -Dorg.gradle.daemon=false

jobs:
  unit-tests:
    name: unit-tests
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/dev' }}
      - run: ./gradlew :app:testDebugUnitTest :app:koverXmlReportDebug :app:koverHtmlReportDebug --continue
      - name: Upload test results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: allure-results-unit
          path: app/build/test-results/testDebugUnitTest/*.xml
          if-no-files-found: ignore
          retention-days: 14
      - name: Upload coverage
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: coverage-unit
          path: app/build/reports/kover
          if-no-files-found: ignore
          retention-days: 14

  backend-tests:
    name: backend-tests
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/dev' }}
          # The backend is an independent build; its wrapper and settings live in backend/.
          build-root-directory: backend
      # Testcontainers talks to the runner's own Docker daemon; no service containers.
      - run: ./gradlew test integrationTest koverXmlReport koverHtmlReport --continue
      - name: Upload test results
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: allure-results-backend
          path: |
            backend/build/test-results/test/*.xml
            backend/build/test-results/integrationTest/*.xml
          if-no-files-found: ignore
          retention-days: 14
      - name: Upload coverage
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: coverage-backend
          path: backend/build/reports/kover
          if-no-files-found: ignore
          retention-days: 14

  contract-tests:
    name: contract-tests
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/dev' }}
          build-root-directory: backend
      # PIT fails the build below its mutationThreshold (80); --continue still produces every report.
      - run: ./gradlew contractTest pitest koverXmlReport koverHtmlReport --continue
      - name: Upload test results
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: allure-results-contract
          path: backend/build/test-results/contractTest/*.xml
          if-no-files-found: ignore
          retention-days: 14
      - name: Upload coverage
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: coverage-contract
          path: backend/build/reports/kover
          if-no-files-found: ignore
          retention-days: 14
      # Named pit-*, outside the coverage-* pattern, so the report job reads it separately.
      - name: Upload PIT report
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: pit-contract
          path: backend/build/reports/pitest
          if-no-files-found: ignore
          retention-days: 14

  secret-scan:
    name: secret-scan
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    env:
      GITLEAKS_VERSION: "8.30.1"
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Install gitleaks
        run: |
          curl -fsSL -o gitleaks.tgz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tgz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/gl" && tar -xzf gitleaks.tgz -C "$RUNNER_TEMP/gl" gitleaks
          echo "$RUNNER_TEMP/gl" >> "$GITHUB_PATH"
      - name: Scan commit range
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.sha }}
        run: gitleaks git --log-opts="$(scripts/secret-scan-range.sh)" --redact --no-banner --exit-code 1 .

  # Non-gating: ci-gate never needs it. Runs fork code under pull_request, so it holds only
  # contents: read and no secrets. The AVD cache is saved only on dev pushes (PRs restore only).
  e2e-tests:
    name: e2e-tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      # AVD cache name: API level, target, ABI and a manual version. Named without "key" so gitleaks'
      # generic-api-key rule does not flag it.
      AVD_CACHE: avd-api34-default-x86_64-v1
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/dev' }}
      - run: ./gradlew :app:assembleDebug
      # Release proof lives here, not in unit-tests (whose command is fixed to :app:testDebugUnitTest).
      - name: Prove release builds carry no test tags
        run: scripts/test-release-no-test-tags.sh
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: e2e/package-lock.json
      - name: Install e2e dependencies
        working-directory: e2e
        run: npm ci
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Restore AVD cache
        id: avd-cache
        uses: actions/cache/restore@v6
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: ${{ env.AVD_CACHE }}
      - name: Create AVD snapshot
        if: ${{ github.ref == 'refs/heads/dev' && steps.avd-cache.outputs.cache-hit != 'true' }}
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: default
          arch: x86_64
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: false
          script: echo "Generated AVD snapshot for caching."
      - name: Save AVD cache
        if: ${{ github.ref == 'refs/heads/dev' && steps.avd-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v6
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: ${{ env.AVD_CACHE }}
      - name: Run e2e suite
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: default
          arch: x86_64
          force-avd-creation: false
          disable-animations: true
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          working-directory: e2e
          script: |
            adb shell cmd connectivity airplane-mode enable
            npm run e2e
      - name: Upload e2e results
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: allure-results-e2e
          path: e2e/allure-results
          if-no-files-found: ignore
          retention-days: 7

  report:
    name: report
    needs: [unit-tests, backend-tests, contract-tests, e2e-tests]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: write
    concurrency:
      group: gh-pages
      cancel-in-progress: false
    env:
      ALLURE_VERSION: "2.46.2"
      ALLURE_SHA256: 83021e2c02e9a3487df249ef7bbf51c1b9f23b722bd288c6d1785609303e0df8
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: scripts
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - name: Download test results
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          pattern: allure-results-*
          merge-multiple: true
          path: allure-results
      - name: Download coverage
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          pattern: coverage-*
          path: coverage
      - name: Download PIT report
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          pattern: pit-*
          path: pit
      - name: Detect results
        id: detect
        run: |
          if compgen -G "allure-results/*.xml" >/dev/null || compgen -G "allure-results/*-result.json" >/dev/null; then
            echo "has_results=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_results=false" >> "$GITHUB_OUTPUT"
            echo "### Report skipped: no test results" >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Install Allure
        if: steps.detect.outputs.has_results == 'true'
        run: |
          curl -fsSL -o allure.tgz \
            "https://github.com/allure-framework/allure2/releases/download/${ALLURE_VERSION}/allure-${ALLURE_VERSION}.tgz"
          echo "${ALLURE_SHA256}  allure.tgz" | sha256sum -c -
          tar -xzf allure.tgz
          echo "$PWD/allure-${ALLURE_VERSION}/bin" >> "$GITHUB_PATH"
      - name: Build report site
        id: site
        if: steps.detect.outputs.has_results == 'true'
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          ACTOR: ${{ github.actor }}
        run: |
          mkdir -p site
          allure generate allure-results -o site/allure --clean
          summary="$(jq -r '.statistic | "\(.passed) passed, \(.failed) failed, \(.broken) broken, \(.skipped) skipped (\(.total) total)"' site/allure/widgets/summary.json)"
          # One coverage figure per component: the Android app and the JVM backend.
          coverage_of() {
            local xml parsed line_cov branch_cov
            xml="$(find "$1" -type f -name "$2" 2>/dev/null | head -n 1 || true)"
            [ -n "$xml" ] || { echo "unavailable"; return; }
            parsed="$(scripts/kover-summary.sh "$xml" 2>/dev/null || true)"
            [ -n "$parsed" ] || { echo "unavailable"; return; }
            line_cov="${parsed#line=}"; line_cov="${line_cov%% *}"
            branch_cov="${parsed##*branch=}"
            echo "line ${line_cov}%, branch ${branch_cov}%"
          }
          html_of() { find "$1" -type d -name "$2" 2>/dev/null | head -n 1 || true; }
          app_html="$(html_of coverage/coverage-unit htmlDebug)"
          backend_html="$(html_of coverage/coverage-backend html)"
          [ -n "$app_html" ] && cp -r "$app_html" site/kover
          [ -n "$backend_html" ] && cp -r "$backend_html" site/kover-backend
          app_coverage="$(coverage_of coverage/coverage-unit reportDebug.xml)"
          backend_coverage="$(coverage_of coverage/coverage-backend report.xml)"
          contract_html="$(html_of coverage/coverage-contract html)"
          [ -n "$contract_html" ] && cp -r "$contract_html" site/kover-contract
          pit_xml="$(find pit -type f -name mutations.xml 2>/dev/null | head -n 1 || true)"
          pit_score="unavailable"
          if [ -n "$pit_xml" ]; then
            pit_parsed="$(scripts/pit-summary.sh "$pit_xml" 2>/dev/null || true)"
            if [ -n "$pit_parsed" ]; then
              pit_score="${pit_parsed%% *}"
              pit_score="${pit_score#score=}%"
            fi
          fi
          [ -n "$pit_xml" ] && cp -r "$(dirname "$pit_xml")" site/pit
          coverage="app ${app_coverage}; backend ${backend_coverage}; PIT ${pit_score}"
          {
            echo "### Test report"
            echo "- Tests: ${summary}"
            echo "- Coverage (app): ${app_coverage}"
            echo "- Coverage (backend): ${backend_coverage}"
            echo "- Mutation score (PIT, threshold 80): ${pit_score}"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$EVENT_NAME" = "pull_request" ]; then dest="pr-${PR_NUMBER}"; else dest="dev"; fi
          publish=false
          if [ "$EVENT_NAME" = "push" ] || [ "$HEAD_REPO" = "$GITHUB_REPOSITORY" ]; then publish=true; fi
          # Dependabot tokens are read-only; never try to publish or comment.
          if [ "$ACTOR" = "dependabot[bot]" ]; then publish=false; fi
          {
            echo "dest=${dest}"
            echo "publish=${publish}"
            echo "tests=${summary}"
            echo "coverage=${coverage}"
          } >> "$GITHUB_OUTPUT"
      - name: Upload report site
        if: steps.detect.outputs.has_results == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: report-site
          path: site
          retention-days: 14
      - name: Publish to gh-pages
        if: steps.detect.outputs.has_results == 'true' && steps.site.outputs.publish == 'true'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ github.token }}
          publish_dir: site
          destination_dir: ${{ steps.site.outputs.dest }}
          keep_files: true
      - name: Compose PR comment
        if: steps.detect.outputs.has_results == 'true' && steps.site.outputs.publish == 'true' && github.event_name == 'pull_request'
        env:
          DEST: ${{ steps.site.outputs.dest }}
          TESTS: ${{ steps.site.outputs.tests }}
          COVERAGE: ${{ steps.site.outputs.coverage }}
        run: |
          repo="${GITHUB_REPOSITORY#*/}"
          base="https://${GITHUB_REPOSITORY_OWNER,,}.github.io/${repo}/${DEST}"
          {
            echo "### CI report"
            echo
            echo "- [Allure report](${base}/allure/)"
            echo "- [Kover coverage (app)](${base}/kover/)"
            echo "- [Kover coverage (backend)](${base}/kover-backend/)"
            echo "- [PIT mutation report](${base}/pit/)"
            echo "- Tests: ${TESTS}"
            echo "- Coverage: ${COVERAGE}"
          } > comment.md
      - name: Sticky PR comment
        if: steps.detect.outputs.has_results == 'true' && steps.site.outputs.publish == 'true' && github.event_name == 'pull_request'
        uses: marocchino/sticky-pull-request-comment@v3
        with:
          header: ci-report
          path: comment.md

  ci-gate:
    name: ci-gate
    permissions:
      contents: read
    needs: [unit-tests, backend-tests, contract-tests, secret-scan]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - name: Require the gating jobs to succeed
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          bad="$(jq -r 'to_entries[] | select(.value.result != "success") | "\(.key)=\(.value.result)"' <<<"$NEEDS")"
          if [ -n "$bad" ]; then
            echo "::error::Gating job not successful: $(tr '\n' ' ' <<<"$bad")"
            exit 1
          fi

  # Publishes the backend image for a green dev commit. Not a ci-gate need, so it never blocks
  # merges; it runs only on pushes to dev (never on pull requests or forks), after ci-gate passes.
  # The package stays private; promote.yml checks and retags this same digest.
  publish-image:
    name: publish-image
    needs: ci-gate
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: true
          build-root-directory: backend
      - name: Build the jar
        working-directory: backend
        run: ./gradlew bootJar
      - name: Log in to GHCR
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: echo "$GITHUB_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
      - name: Build and push the image
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}/backend"
          docker buildx build \
            --platform linux/amd64 \
            --file backend/Dockerfile \
            --tag "${image}:sha-${GITHUB_SHA}" \
            --tag "${image}:dev" \
            --push \
            backend
          echo "### Published \`${image}:sha-${GITHUB_SHA}\` and \`:dev\`" >> "$GITHUB_STEP_SUMMARY"
