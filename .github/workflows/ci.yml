# Runs the unit tests and the secret scan on every pull request and dev push,
# then publishes Allure and Kover reports to gh-pages. Quality checks (lint,
# format, detekt, shell, workflows, commit messages) run ONLY locally via
# lefthook, never here; secrets are scanned here so --no-verify cannot skip them.
# `ci-gate` is the single required status check; `report` never gates.
name: CI

on:
  pull_request:
  push:
    branches: [dev]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  GRADLE_OPTS: -Dorg.gradle.daemon=false

jobs:
  unit-tests:
    name: unit-tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/dev' }}
      - run: ./gradlew :app:testDebugUnitTest :app:koverXmlReportDebug :app:koverHtmlReportDebug --continue
      - name: Upload test results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: allure-results-unit
          path: app/build/test-results/testDebugUnitTest/*.xml
          if-no-files-found: ignore
          retention-days: 14
      - name: Upload coverage
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: coverage-unit
          path: app/build/reports/kover
          if-no-files-found: ignore
          retention-days: 14

  secret-scan:
    name: secret-scan
    runs-on: ubuntu-24.04
    env:
      GITLEAKS_VERSION: "8.30.1"
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Install gitleaks
        run: |
          curl -fsSL -o gitleaks.tgz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tgz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/gl" && tar -xzf gitleaks.tgz -C "$RUNNER_TEMP/gl" gitleaks
          echo "$RUNNER_TEMP/gl" >> "$GITHUB_PATH"
      - name: Scan commit range
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.sha }}
        run: gitleaks git --log-opts="$(scripts/secret-scan-range.sh)" --redact --no-banner --exit-code 1 .

  report:
    name: report
    needs: [unit-tests]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: write
    concurrency:
      group: gh-pages
      cancel-in-progress: false
    env:
      ALLURE_VERSION: "2.46.2"
      ALLURE_SHA256: 83021e2c02e9a3487df249ef7bbf51c1b9f23b722bd288c6d1785609303e0df8
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: scripts
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - name: Download test results
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          pattern: allure-results-*
          merge-multiple: true
          path: allure-results
      - name: Download coverage
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          pattern: coverage-*
          path: coverage
      - name: Detect results
        id: detect
        run: |
          if compgen -G "allure-results/*.xml" >/dev/null; then
            echo "has_results=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_results=false" >> "$GITHUB_OUTPUT"
            echo "### Report skipped: no test results (unit-tests did not run)" >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Install Allure
        if: steps.detect.outputs.has_results == 'true'
        run: |
          curl -fsSL -o allure.tgz \
            "https://github.com/allure-framework/allure2/releases/download/${ALLURE_VERSION}/allure-${ALLURE_VERSION}.tgz"
          echo "${ALLURE_SHA256}  allure.tgz" | sha256sum -c -
          tar -xzf allure.tgz
          echo "$PWD/allure-${ALLURE_VERSION}/bin" >> "$GITHUB_PATH"
      - name: Build report site
        id: site
        if: steps.detect.outputs.has_results == 'true'
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          ACTOR: ${{ github.actor }}
        run: |
          mkdir -p site
          allure generate allure-results -o site/allure --clean
          kover_html="$(find coverage -type d -name htmlDebug | head -n 1)"
          kover_xml="$(find coverage -type f -name reportDebug.xml | head -n 1)"
          [ -n "$kover_html" ] && cp -r "$kover_html" site/kover
          summary="$(jq -r '.statistic | "\(.passed) passed, \(.failed) failed, \(.broken) broken, \(.skipped) skipped (\(.total) total)"' site/allure/widgets/summary.json)"
          coverage="unavailable"
          if [ -n "$kover_xml" ]; then
            parsed="$(scripts/kover-summary.sh "$kover_xml" 2>/dev/null || true)"
            if [ -n "$parsed" ]; then
              line_cov="${parsed#line=}"; line_cov="${line_cov%% *}"
              branch_cov="${parsed##*branch=}"
              coverage="line ${line_cov}%, branch ${branch_cov}%"
            fi
          fi
          {
            echo "### Test report"
            echo "- Tests: ${summary}"
            echo "- Coverage: ${coverage}"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$EVENT_NAME" = "pull_request" ]; then dest="pr-${PR_NUMBER}"; else dest="dev"; fi
          publish=false
          if [ "$EVENT_NAME" = "push" ] || [ "$HEAD_REPO" = "$GITHUB_REPOSITORY" ]; then publish=true; fi
          # Dependabot tokens are read-only; never try to publish or comment.
          if [ "$ACTOR" = "dependabot[bot]" ]; then publish=false; fi
          {
            echo "dest=${dest}"
            echo "publish=${publish}"
            echo "tests=${summary}"
            echo "coverage=${coverage}"
          } >> "$GITHUB_OUTPUT"
      - name: Upload report site
        if: steps.detect.outputs.has_results == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: report-site
          path: site
          retention-days: 14
      - name: Publish to gh-pages
        if: steps.detect.outputs.has_results == 'true' && steps.site.outputs.publish == 'true'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ github.token }}
          publish_dir: site
          destination_dir: ${{ steps.site.outputs.dest }}
          keep_files: true
      - name: Compose PR comment
        if: steps.detect.outputs.has_results == 'true' && steps.site.outputs.publish == 'true' && github.event_name == 'pull_request'
        env:
          DEST: ${{ steps.site.outputs.dest }}
          TESTS: ${{ steps.site.outputs.tests }}
          COVERAGE: ${{ steps.site.outputs.coverage }}
        run: |
          repo="${GITHUB_REPOSITORY#*/}"
          base="https://${GITHUB_REPOSITORY_OWNER,,}.github.io/${repo}/${DEST}"
          {
            echo "### CI report"
            echo
            echo "- [Allure report](${base}/allure/)"
            echo "- [Kover coverage](${base}/kover/)"
            echo "- Tests: ${TESTS}"
            echo "- Coverage: ${COVERAGE}"
          } > comment.md
      - name: Sticky PR comment
        if: steps.detect.outputs.has_results == 'true' && steps.site.outputs.publish == 'true' && github.event_name == 'pull_request'
        uses: marocchino/sticky-pull-request-comment@v3
        with:
          header: ci-report
          path: comment.md

  ci-gate:
    name: ci-gate
    needs: [unit-tests, secret-scan]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - name: Require the gating jobs to succeed
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          bad="$(jq -r 'to_entries[] | select(.value.result != "success") | "\(.key)=\(.value.result)"' <<<"$NEEDS")"
          if [ -n "$bad" ]; then
            echo "::error::Gating job not successful: $(tr '\n' ' ' <<<"$bad")"
            exit 1
          fi
