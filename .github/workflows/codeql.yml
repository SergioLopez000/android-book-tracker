# CodeQL analysis for Kotlin. Gates through the dev ruleset ("Require code
# scanning results"), not through ci-gate. See openspec/changes/security-quality-gates.
name: CodeQL

on:
  pull_request:
    branches: [dev]
  push:
    branches: [dev]
  schedule:
    - cron: "23 4 * * 1"

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  analyze:
    name: analyze (java-kotlin)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          # Both JDKs are installed; each build below selects its own through JAVA_HOME_<n>_X64.
          java-version: |
            17
            21
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: true
      - uses: github/codeql-action/init@v4
        with:
          languages: java-kotlin
          build-mode: manual
      # No daemon, no build cache, in-process compiler: the tracer must see kotlinc run.
      - name: Build app (JDK 17)
        env:
          JAVA_HOME: ${{ env.JAVA_HOME_17_X64 }}
        run: ./gradlew --no-daemon --no-build-cache -Pkotlin.compiler.execution.strategy=in-process :app:compileDebugKotlin
      # Second traced build: the backend is an independent Gradle build on JDK 21.
      - name: Build backend (JDK 21)
        env:
          JAVA_HOME: ${{ env.JAVA_HOME_21_X64 }}
        run: ./gradlew --no-daemon --no-build-cache -Pkotlin.compiler.execution.strategy=in-process -p backend compileKotlin
      - uses: github/codeql-action/analyze@v4
        with:
          category: "/language:java-kotlin"
