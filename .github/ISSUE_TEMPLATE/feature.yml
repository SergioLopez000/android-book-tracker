name: Feature
description: Propose new user-facing functionality
title: "feat: "
labels: ["type:feature"]
body:
  - type: textarea
    id: story
    attributes:
      label: User story
      description: Who needs it, what they want and why.
      placeholder: As a reader, I want ..., so that ...
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria (Given/When/Then)
      description: One scenario per block.
      placeholder: |
        Given ...
        When ...
        Then ...
    validations:
      required: true
  - type: checkboxes
    id: qa
    attributes:
      label: QA checklist
      description: Ticked during manual QA in dev.
      options:
        - label: Tested in dev on a physical device or emulator
        - label: Acceptance criteria scenarios checked one by one
        - label: Edge cases and empty or error states checked
        - label: Result recorded in a comment on this issue
  - type: textarea
    id: qa_notes
    attributes:
      label: QA notes
      description: Optional. Devices, data or edge cases to cover.
  - type: checkboxes
    id: dod
    attributes:
      label: Definition of Done
      options:
        - label: SDD change (explore → proposal → spec → design → tasks → apply → verify → archive) linked here
        - label: Tests written first (Strict TDD) and green in CI
        - label: Local hooks green, and CodeQL and secret-scan green in CI
        - label: Manual QA done in dev and recorded in a comment
        - label: "`qa:approved` label added and promoted to staging"
  - type: dropdown
    id: area
    attributes:
      label: Area
      description: Informative only; the area label is applied by hand.
      options:
        - app
        - infra
