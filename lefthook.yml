# yaml-language-server: $schema=https://lefthook.dev/schema.json
pre-commit:
  parallel: true
  jobs:
    - name: spotless
      glob: "*.{kt,kts}"
      run: ./gradlew --quiet spotlessCheck || { echo "Run ./gradlew spotlessApply"; exit 1; }
    - name: android-lint
      glob: "{app/**/*.{kt,kts,xml},*.gradle.kts,gradle/*.toml,gradle.properties}"
      run: ./gradlew --quiet :app:lintDebug || { echo "Android Lint failed. See app/build/reports/lint-results-debug.html; fix it or run ./gradlew :app:updateLintBaseline for accepted legacy issues"; exit 1; }
    - name: detekt
      glob: "*.kt"
      run: command -v detekt >/dev/null || { echo "brew install detekt"; exit 1; }; set -- {staged_files}; IFS=','; detekt --input "$*" --config config/detekt/detekt.yml --build-upon-default-config --baseline config/detekt/baseline.xml || { echo "Fix the detekt issues, or regenerate config/detekt/baseline.xml for accepted legacy issues (see README)"; exit 1; }
    - name: gitleaks
      run: command -v gitleaks >/dev/null || { echo "brew install gitleaks"; exit 1; }; gitleaks git --pre-commit --staged --redact --no-banner
    - name: actionlint
      glob: ".github/workflows/*.{yml,yaml}"
      run: command -v actionlint >/dev/null || { echo "brew install actionlint shellcheck"; exit 1; }; actionlint
    - name: secrets-contract
      glob: "{.github/workflows/*.{yml,yaml},docs/secrets.md,scripts/*secrets-contract*.sh}"
      run: bash scripts/test-secrets-contract.sh
    - name: token-expiry-notify
      glob: "{.github/workflows/token-expiry.yml,scripts/*token-expiry*.sh}"
      run: bash scripts/test-token-expiry-notify.sh
    - name: shellcheck
      glob: "*.sh"
      run: command -v shellcheck >/dev/null || { echo "brew install shellcheck"; exit 1; }; shellcheck {staged_files} && scripts/test-check-commit-msg.sh
    - name: e2e-typecheck
      glob: "{e2e/*.ts,e2e/**/*.ts}"
      run: 'cd e2e && { [ -d node_modules ] || { echo "Run: cd e2e && npm ci"; exit 1; }; } && npx --no-install tsc --noEmit || { echo "Fix the TypeScript errors (cd e2e && npm run typecheck)"; exit 1; }'
commit-msg:
  jobs:
    - name: conventional-commit
      run: scripts/check-commit-msg.sh {1}
