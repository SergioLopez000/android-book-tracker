schema: spec-driven

context: |
  Rincon de Lectura: native Android, local-first, single-user book tracker (rate + review).
  Two independent Gradle builds, both package com.librosleidos, Gradle 9.9.1 (wrapper in each); the backend build is frozen (#91) and nothing in CI builds it.
  App (root, module :app): Kotlin 2.4.21, AGP 9.1.1 (built-in Kotlin), JDK 17, Jetpack Compose (Material3, BOM 2026.08.00), Room 2.8.4 + KSP, Coil 3.
  Hexagonal architecture (ports and adapters): domain/{model,port,usecase}, data/{local,remote}, ui/*, di.
  Remote metadata: Open Library with Google Books fallback (optional API key in local.properties).
  Tests: JUnit4 + Robolectric + Compose UI test + Turbine + coroutines-test under app/src/test.
  Backend (backend/): frozen since #91. The code is kept byte-identical but no workflow, CodeQL run or
  Dependabot entry touches it and no image is published. Revert the #91 squash commit to reactivate it.

strict_tdd: true

testing:
  workspace_command: "./gradlew :app:testDebugUnitTest"
  projects:
    - path: "."
      stack: "Kotlin/Android (Gradle module :app)"
      test_command: "./gradlew :app:testDebugUnitTest"
      framework: "JUnit4 + Robolectric"
  layers:
    unit: { available: true, tool: "JUnit4 + Robolectric + coroutines-test + Turbine" }
    integration: { available: true, tool: "Robolectric + Room (room-testing) in app/src/test" }
    contract: { available: false, tool: "frozen with the backend (#91)" }
    mutation: { available: false, tool: "frozen with the backend (#91)" }
    e2e: { available: true, tool: "Appium 3.9.1 + WebdriverIO 10.2.0 (e2e/)" }
  coverage: { available: true, command: "./gradlew koverHtmlReportDebug" }
  quality:
    linter: { available: true, command: "./gradlew :app:lintDebug" }
    type_checker: { available: true, command: "Kotlin compiler (./gradlew :app:compileDebugKotlin)" }
    formatter: { available: true, command: "./gradlew spotlessCheck" }
    static_analysis: { available: true, tool: "detekt 1.23.8 CLI (brew)", command: "detekt --input app/src --config config/detekt/detekt.yml --build-upon-default-config --baseline config/detekt/baseline.xml" }

rules:
  proposal:
    - Keep changes within the hexagonal layering; domain must not depend on Android or data packages.
  specs:
    - Use Given/When/Then scenarios; existing capabilities live under openspec/specs.
  design:
    - Prefer ports in domain/port with adapters in data/*.
  tasks:
    - Tests first (Strict TDD). Review budget 800 changed lines; delivery_strategy ask-on-risk.
  apply:
    - Write a failing test, make it pass, then refactor. Run ./gradlew :app:testDebugUnitTest.
  verify:
    - Run ./gradlew :app:testDebugUnitTest; also ./gradlew spotlessCheck :app:lintDebug koverHtmlReportDebug.
    - Run bash scripts/test-secrets-contract.sh (local-only, via lefthook; never in CI); it checks the secrets allow-list, job permissions and the inventory drift guard (every secrets.* name and allow-list entry must be in docs/secrets.md, with its required headings and owner) through scripts/check-secrets-contract.sh.
    - Run bash scripts/test-backend-frozen.sh (local-only, via lefthook; never in CI); it checks that no workflow or Dependabot entry touches the frozen backend (#91) through scripts/check-backend-frozen.sh.
    - Run bash scripts/test-token-expiry.sh (local-only, never in CI); it checks the PROJECT_TOKEN expiry parser scripts/token-expiry.sh (states, header casing, CRLF, hostile values) used by .github/workflows/token-expiry.yml.
    - Run bash scripts/test-token-expiry-notify.sh (local-only, never in CI); it drives scripts/token-expiry-notify.sh and scripts/token-expiry-read.sh with a fake gh and curl on PATH (issue open/edit without duplicates, never close or comment, hostile values, empty-token skip) used by .github/workflows/token-expiry.yml.
    - Run detekt (quality.static_analysis.command); it must report no new issues beyond config/detekt/baseline.xml.
    - Run bash scripts/test-release-no-test-tags.sh; it proves the release build carries no TestTagsAsResourceId (source and bytecode, with a debug positive control) and runs :app:testReleaseUnitTest for E2eRootReleaseTest.
    - Run bash scripts/test-e2e-ci-config.sh; it statically checks the non-gating e2e-tests job, the report wiring and the npm Dependabot entry.
    - Run the shell harnesses: bash scripts/test-resolve-issue-number.sh and bash scripts/test-board-sync.sh (with the existing scripts/test-*.sh).
  archive:
    - Do not modify archived changes.
