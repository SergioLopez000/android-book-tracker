openapi: 3.0.3
info:
  title: Libros Leidos API
  version: 0.0.1
  description: |
    Books CRUD, scoped to the authenticated owner. The owner is never part of any
    request or response body. Every operation requires a Google ID token as a bearer
    credential; the owner is the token `sub`. Any authentication failure is a 401 with
    an empty body.
security:
  - bearerAuth: []
paths:
  /api/books:
    get:
      operationId: listBooks
      security:
        - bearerAuth: []
      tags: [books]
      summary: List the books of the authenticated owner
      responses:
        "200":
          description: The owner's books
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Book"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      operationId: createBook
      security:
        - bearerAuth: []
      tags: [books]
      summary: Create a book for the authenticated owner
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BookRequest"
      responses:
        "201":
          description: The created book
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Book"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/books/{id}:
    parameters:
      - $ref: "#/components/parameters/BookId"
    get:
      operationId: getBook
      security:
        - bearerAuth: []
      tags: [books]
      summary: Get one book of the authenticated owner
      responses:
        "200":
          description: The book
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Book"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      operationId: updateBook
      security:
        - bearerAuth: []
      tags: [books]
      summary: Replace one book of the authenticated owner
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BookRequest"
      responses:
        "200":
          description: The updated book
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Book"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      operationId: deleteBook
      security:
        - bearerAuth: []
      tags: [books]
      summary: Delete one book of the authenticated owner
      responses:
        "204":
          description: Deleted
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    BookId:
      name: id
      in: path
      required: true
      schema:
        type: integer
        format: int64
        minimum: 1
  responses:
    BadRequest:
      description: The request does not match this contract
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Unauthorized:
      description: Not authenticated (empty body)
    NotFound:
      description: No such book for the authenticated owner
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
  schemas:
    BookRequest:
      type: object
      additionalProperties: false
      required: [title, author, rating, dateFinished]
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 200
        author:
          type: string
          minLength: 1
          maxLength: 200
        coverUrl:
          type: string
          nullable: true
          maxLength: 2048
        rating:
          type: number
          minimum: 0.5
          maximum: 5
          multipleOf: 0.5
        review:
          type: string
          maxLength: 5000
        dateFinished:
          type: string
          format: date
    Book:
      type: object
      additionalProperties: false
      required: [id, title, author, coverUrl, rating, review, dateFinished]
      properties:
        id:
          type: integer
          format: int64
          minimum: 1
        title:
          type: string
          maxLength: 200
        author:
          type: string
          maxLength: 200
        coverUrl:
          type: string
          nullable: true
          maxLength: 2048
        rating:
          type: number
          minimum: 0.5
          maximum: 5
        review:
          type: string
          maxLength: 5000
        dateFinished:
          type: string
          format: date
    Problem:
      type: object
      required: [title, status, detail]
      properties:
        type:
          type: string
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
