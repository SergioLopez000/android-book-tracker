org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

android.useAndroidX=true
android.nonTransitiveRClass=true
# AGP 9's built-in Kotlin support rejects `kotlin.sourceSets` mutation by
# default; KSP 2.2.10-2.0.2 still registers generated sources that way, so
# this is the officially documented escape hatch (see error text pointing
# to https://developer.android.com/r/tools/built-in-kotlin). Revisit once
# a KSP release that targets built-in Kotlin natively is adopted.
android.disallowKotlinSourceSets=false

kotlin.code.style=official
